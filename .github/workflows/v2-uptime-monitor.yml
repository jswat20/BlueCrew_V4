name: Slate V2 independent uptime probe

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-v2-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require three consecutive safe probe failures
        shell: bash
        run: |
          set -euo pipefail
          target='https://the-slate-v2.pages.dev/'
          failures=0
          for attempt in 1 2 3; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' "$target" || true)"
            if [[ "$status" == "200" ]] && grep -q 'The Slate' "$body"; then
              echo "V2 staging probe succeeded on attempt $attempt."
              exit 0
            fi
            failures=$((failures + 1))
            echo "V2 staging probe attempt $attempt failed with HTTP ${status:-network_error}."
            sleep 10
          done
          echo "V2 staging sustained failure: $failures consecutive probes failed."
          exit 1
